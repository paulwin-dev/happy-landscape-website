backend:
  name: github
  repo: paulwin-dev/happy-landscape-website
  branch: main
  base_url: https://decap-proxy.happy-landscape-oauth-proxy.workers.dev/   # see step 2

media_folder: "images/uploads"     # where uploads are saved in the repo
public_folder: "/images/uploads"   # how they're referenced on the site

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }