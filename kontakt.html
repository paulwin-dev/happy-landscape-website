<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Kontaktieren Sie Happy Landscape in Storkow/Mark." data-cms-description="meta.description">
  <title data-cms-text="meta.title">Kontakt | Happy Landscape</title>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Yellowtail&family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/root.css">
  <link rel="stylesheet" href="css/impressum.css">
</head>

<body data-cms-content-file="data/kontakt/seite.json">
  <site-header></site-header>

  <main>
    <section class="legal-hero">
      <div class="legal-hero__content">
        <div class="eyebrow" data-cms-text="hero.eyebrow">Happy Landscape · Storkow/Mark</div>
        <h1 data-cms-text="hero.title">Kontakt</h1>
        <p data-cms-text="hero.description">Wir freuen uns auf Ihre Nachricht.</p>
      </div>
    </section>

    <section class="legal-content" aria-labelledby="contact-heading">
      <div class="legal-content__inner">
        <div class="legal-intro">
          <div class="eyebrow" data-cms-text="contact.eyebrow">So erreichen Sie uns</div>
          <h2 id="contact-heading" data-cms-text="company.name">Happy Landscape GmbH</h2>
          <p data-cms-text="company.address" data-cms-lines>
            Herweghstraße 2
            15859 Storkow/Mark
          </p>
          <p>
            <span data-cms-text="contact.phoneLabel">Telefon:</span> <a data-cms-text="company.primaryContact.phone" data-cms-href="company.primaryContact.phoneHref" href="tel:+493367872753">+49 33678 / 72 75 3</a><br>
            <span data-cms-text="contact.emailLabel">E-Mail:</span> <a data-cms-text="company.primaryContact.email" data-cms-href="company.primaryContact.emailHref" href="mailto:m.sader@happy-landscape.de">m.sader@happy-landscape.de</a>
          </p>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="js/root.js"></script>
</body>

</html>
